name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      REDIS_CACHE_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js e cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Preparar Prisma
        run: |
          pnpm dlx prisma@6.16.1 generate
          pnpm dlx prisma@6.16.1 migrate deploy

      - name: Verificar código com ESLint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Testes unitários e cobertura
        run: pnpm exec jest --ci --coverage --passWithNoTests

      - name: Publicar relatórios de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/
          if-no-files-found: ignore

      - name: Compilar
        run: pnpm run build
